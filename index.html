<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess - 20 Levels</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <header class="top-bar">
            <div class="brand">
                <h1>CHESS PRO</h1>
                <span id="level-badge" class="badge">Level 1 / 20</span>
            </div>
            <div class="controls">
                <select id="level-select" class="level-dropdown"></select>
                <button id="restart-top-btn" class="btn-secondary">Restart</button>
            </div>
        </header>

        <main class="game-layout">
            <div class="board-section">
                <div class="player-bar black-player" id="black-bar">
                    <div class="player-info">
                        <div class="avatar black-avatar">AI</div>
                        <div>
                            <div class="player-name" id="ai-name">Bot - Level 1</div>
                            <div class="captured-pieces" id="black-captured"></div>
                        </div>
                    </div>
                    <div class="status-pill" id="black-status">Waiting</div>
                </div>

                <div class="board-container">
                    <div id="chessboard" class="chessboard"></div>
                </div>

                <div class="player-bar white-player" id="white-bar">
                    <div class="player-info">
                        <div class="avatar white-avatar">YOU</div>
                        <div>
                            <div class="player-name">Player (White)</div>
                            <div class="captured-pieces" id="white-captured"></div>
                        </div>
                    </div>
                    <div class="status-pill active" id="white-status">Your Turn</div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="card analysis-card">
                    <h3>Move Intelligence</h3>
                    <div id="move-rating" class="rating-box neutral">
                        <span class="rating-title">Ready to Start</span>
                        <span class="rating-desc">Make your opening move</span>
                    </div>
                    <div class="accuracy-meter">
                        <div class="meter-label">
                            <span>Match Accuracy</span>
                            <span id="accuracy-percent">100%</span>
                        </div>
                        <div class="meter-track">
                            <div id="accuracy-fill" class="meter-fill" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>

                <div class="card history-card">
                    <h3>Move Log</h3>
                    <div id="moves-history" class="moves-list"></div>
                </div>
            </aside>
        </main>
    </div>

    <div id="end-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div id="modal-icon" class="modal-icon">🏆</div>
            <h2 id="modal-title">Victory!</h2>
            <p id="modal-subtitle">Checkmate! You conquered Level 1.</p>
            <div class="modal-actions">
                <button id="next-level-btn" class="btn-primary hidden">Next Level</button>
                <button id="modal-restart-btn" class="btn-primary">Restart Level</button>
                <button id="quit-btn" class="btn-danger">Quit Game</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
